<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>カメラテスト</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      overscroll-behavior: none;
    }

    /* 画面全体をプレビュー領域にし、中央にカメラ映像を配置 */
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* 映像の描画サイズにぴったり追従する枠。UIはこの中に重ねる */
    #frame {
      position: relative;
      display: flex;
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
    }

    /* 停止中は映像が無いので、枠を画面いっぱいに広げてUIを配置する */
    #frame.idle {
      width: 100%;
      height: 100%;
    }

    /* 幅・高さを auto にすることで、画面に収まる最大サイズまで
       アスペクト比を維持したまま拡大される */
    #video {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      background: #000;
    }

    #video.mirrored {
      transform: scaleX(-1);
    }

    /* --- プレビューに重ねるUI --- */

    /* バーコードの検出領域。この枠の内側だけを切り出して解析する */
    #scanArea {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 520px;
      height: 24%;
      min-height: 96px;
      max-height: 180px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      /* 枠の外側をまとめて暗くする */
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      pointer-events: none;
    }

    /* 停止中はプレビューが無いので枠も隠す */
    #frame.idle #scanArea {
      display: none;
    }

    #scanLine {
      position: absolute;
      left: 8px;
      right: 8px;
      height: 2px;
      border-radius: 2px;
      background: rgba(255, 64, 64, 0.9);
      box-shadow: 0 0 8px rgba(255, 64, 64, 0.8);
      animation: scanSweep 2s ease-in-out infinite;
    }

    @keyframes scanSweep {
      0%, 100% {
        top: 10%;
      }

      50% {
        top: 90%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #scanLine {
        top: 50%;
        animation: none;
      }
    }

    /* 読み取り結果のトースト */
    #toast {
      position: absolute;
      left: 50%;
      bottom: 80px;
      max-width: calc(100% - 24px);
      padding: 10px 18px;
      border-radius: 12px;
      background: rgba(22, 163, 74, 0.92);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-align: center;
      word-break: break-all;
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }

    #toast.error {
      background: rgba(220, 38, 38, 0.92);
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      max-width: calc(100% - 24px);
      margin: 0;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      font-size: 13px;
      line-height: 1.4;
      transition: opacity 0.2s;
    }

    #status:empty {
      opacity: 0;
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px 12px;
      pointer-events: none;
    }

    #controls > button {
      pointer-events: auto;
    }

    button {
      padding: 11px 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: rgba(20, 20, 20, 0.55);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) {
      background: rgba(60, 60, 60, 0.7);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #startBtn {
      background: rgba(45, 127, 249, 0.85);
      border-color: transparent;
    }

    #startBtn:hover:not(:disabled) {
      background: rgba(45, 127, 249, 1);
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <video id="video" playsinline autoplay muted></video>

      <div id="scanArea" aria-hidden="true">
        <div id="scanLine"></div>
      </div>

      <p id="status"></p>

      <div id="toast" role="status" aria-live="polite"></div>

      <div id="controls">
        <button id="startBtn">カメラを起動</button>
        <button id="switchBtn" disabled>前後切替</button>
        <button id="stopBtn" disabled>停止</button>
      </div>
    </div>
  </div>

  <script src="barcode.js"></script>
  <script src="camera.js"></script>
</body>
</html>
