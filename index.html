<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- GitHub Pages は max-age=600 を付けて返すので、HTML は必ず再検証させる（更新が無ければ 304 で軽い） -->
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>カメラテスト</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      overscroll-behavior: none;
    }

    /* 画面全体をプレビュー領域にし、中央にカメラ映像を配置 */
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* 映像の描画サイズにぴったり追従する枠。UIはこの中に重ねる */
    #frame {
      position: relative;
      display: flex;
      /* 既定の stretch のままだと、枠を画面いっぱいに広げている停止中だけ
         video が画面の高さまで引き伸ばされ、中で映像がレターボックスになる。
         起動の瞬間に video の箱が「画面いっぱい」から「映像そのもの」へ縮むため、
         映像が一瞬ずれて見える。中央寄せにして停止中も稼働中も同じ箱にする */
      align-items: center;
      justify-content: center;
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
    }

    /* 停止中は映像が無いので、枠を画面いっぱいに広げてUIを配置する */
    #frame.idle {
      width: 100%;
      height: 100%;
    }

    /* 幅・高さを auto にすることで、画面に収まる最大サイズまで
       アスペクト比を維持したまま拡大される。
       上限は枠ではなく画面（#stage と同じ 100vw / 100dvh）に対して掛ける。
       枠は映像の描画サイズに追従する＝高さが不定なので、% だと停止中
       （枠 = 画面）と稼働中（枠 = 映像）で解決結果が変わってしまう */
    #video {
      display: block;
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      background: #000;
    }

    #video.mirrored {
      transform: scaleX(-1);
    }

    /* --- プレビューに重ねるUI --- */

    /* バーコードの検出領域。この枠の内側だけを切り出して解析する */
    #scanArea {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      /* 1D（横長）と 2D（正方形）のどちらも収まる比率にしている */
      width: 80%;
      max-width: 520px;
      height: 40%;
      min-height: 150px;
      max-height: 320px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      /* 枠の外側をまとめて暗くする */
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    /* 停止中はプレビューが無いので枠も隠す */
    #frame.idle #scanArea {
      display: none;
    }

    /* 読み取り結果のダイアログ */
    #result {
      width: 100%;
      max-width: min(420px, calc(100vw - 32px));
      margin: auto;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(28, 28, 30, 0.97);
      color: #fff;
    }

    #result::backdrop {
      background: rgba(0, 0, 0, 0.6);
    }

    #resultBody {
      padding: 22px 22px 0;
    }

    #resultTitle {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 600;
    }

    #result.error #resultTitle {
      color: #fca5a5;
    }

    #resultFormat {
      margin: 0 0 14px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.55);
    }

    #resultFormat:empty {
      display: none;
    }

    #resultValue {
      margin: 0;
      padding: 12px 14px;
      max-height: 40vh;
      overflow: auto;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 17px;
      line-height: 1.5;
      white-space: pre-line;
      word-break: break-all;
      user-select: text;
    }

    #resultActions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 18px 22px 22px;
    }

    #resultActions button {
      padding: 9px 18px;
      font-size: 14px;
    }

    #resultCloseBtn {
      background: rgba(45, 127, 249, 0.85);
      border-color: transparent;
    }

    #resultCloseBtn:hover:not(:disabled) {
      background: rgba(45, 127, 249, 1);
    }

    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      max-width: calc(100% - 24px);
      margin: 0;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      font-size: 13px;
      line-height: 1.4;
      transition: opacity 0.2s;
    }

    #status:empty {
      opacity: 0;
    }

    /* 使用中の検出エンジン。動いているかどうかの確認用 */
    #engine {
      position: absolute;
      top: 12px;
      right: 12px;
      margin: 0;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.75);
    }

    #engine:empty,
    #frame.idle #engine {
      display: none;
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px 12px;
      pointer-events: none;
    }

    #controls > button {
      pointer-events: auto;
    }

    button {
      padding: 11px 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: rgba(20, 20, 20, 0.55);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) {
      background: rgba(60, 60, 60, 0.7);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #startBtn {
      background: rgba(45, 127, 249, 0.85);
      border-color: transparent;
    }

    #startBtn:hover:not(:disabled) {
      background: rgba(45, 127, 249, 1);
    }

    /* --- 撮影 --- */

    /* シャッターを切ったときにプレビューを一瞬白く光らせる */
    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }

    #flash.on {
      animation: flash 0.35s ease-out;
    }

    @keyframes flash {
      from {
        opacity: 0.85;
      }

      to {
        opacity: 0;
      }
    }

    #frame.idle #flash {
      display: none;
    }

    /* 撮影結果のダイアログ。写真を見せる分だけ #result より広くしている */
    #photo {
      width: 100%;
      max-width: min(520px, calc(100vw - 32px));
      margin: auto;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(28, 28, 30, 0.97);
      color: #fff;
    }

    #photo::backdrop {
      background: rgba(0, 0, 0, 0.6);
    }

    #photoBody {
      padding: 18px 18px 0;
    }

    #photoImage {
      display: block;
      width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 10px;
      background: #000;
    }

    #photoInfo {
      margin: 10px 0 0;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-align: center;
      color: rgba(255, 255, 255, 0.55);
    }

    #photoActions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 18px 18px;
    }

    /* 保存は <a download> なので、button と同じ見た目を別途あてる */
    #photoSaveBtn {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: rgba(20, 20, 20, 0.55);
      color: #fff;
      text-decoration: none;
      cursor: pointer;
    }

    #photoSaveBtn:hover {
      background: rgba(60, 60, 60, 0.7);
    }

    #photoActions > * {
      padding: 9px 18px;
      font-size: 14px;
    }

    #photoCloseBtn {
      background: rgba(45, 127, 249, 0.85);
      border-color: transparent;
    }

    #photoCloseBtn:hover:not(:disabled) {
      background: rgba(45, 127, 249, 1);
    }

    /* --- 検出画像のプレビュー --- */

    /* 解析に渡しているのと同じ画像を確認するダイアログ（動作確認用） */
    #scanPreview {
      width: 100%;
      max-width: min(520px, calc(100vw - 32px));
      margin: auto;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(28, 28, 30, 0.97);
      color: #fff;
    }

    #scanPreview::backdrop {
      background: rgba(0, 0, 0, 0.6);
    }

    #scanPreviewBody {
      padding: 18px 18px 0;
    }

    /* 縮小後の画素をそのまま見たいので、拡大時も補間させない。
       市松模様は余白（白）と透明を見分けるため */
    #scanPreviewImage {
      display: block;
      width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 10px;
      image-rendering: pixelated;
      background:
        repeating-conic-gradient(rgba(255, 255, 255, 0.12) 0% 25%, transparent 0% 50%) 0 0 / 16px 16px;
    }

    #scanPreviewInfo {
      margin: 10px 0 0;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-align: center;
      color: rgba(255, 255, 255, 0.55);
    }

    #scanPreviewActions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 18px 18px;
    }

    #scanPreviewActions > button {
      padding: 9px 18px;
      font-size: 14px;
    }

    #scanPreviewCloseBtn {
      background: rgba(45, 127, 249, 0.85);
      border-color: transparent;
    }

    #scanPreviewCloseBtn:hover:not(:disabled) {
      background: rgba(45, 127, 249, 1);
    }

  </style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <video id="video" playsinline autoplay muted></video>

      <div id="scanArea" aria-hidden="true"></div>

      <div id="flash" aria-hidden="true"></div>

      <p id="status"></p>
      <p id="engine"></p>

      <div id="controls">
        <button id="startBtn">カメラを起動</button>
        <button id="shutterBtn" disabled>撮影</button>
        <button id="scanPreviewBtn" disabled>検出画像</button>
        <!-- ラベルは barcode.js が現在の選択で上書きする -->
        <button id="engineBtn">エンジン: 自動</button>
        <button id="switchBtn" disabled>前後切替</button>
        <button id="stopBtn" disabled>停止</button>
      </div>
    </div>
  </div>

  <dialog id="result" aria-labelledby="resultTitle">
    <div id="resultBody">
      <h2 id="resultTitle">バーコードを検出しました</h2>
      <p id="resultFormat"></p>
      <p id="resultValue"></p>
    </div>

    <div id="resultActions">
      <button id="resultCopyBtn" type="button">コピー</button>
      <button id="resultCloseBtn" type="button" autofocus>閉じる</button>
    </div>
  </dialog>

  <dialog id="photo" aria-label="撮影した写真">
    <div id="photoBody">
      <img id="photoImage" alt="">
      <p id="photoInfo"></p>
    </div>

    <div id="photoActions">
      <a id="photoSaveBtn" download>保存</a>
      <button id="photoShareBtn" type="button" hidden>共有</button>
      <button id="photoCloseBtn" type="button" autofocus>閉じる</button>
    </div>
  </dialog>

  <dialog id="scanPreview" aria-label="検出領域の画像">
    <div id="scanPreviewBody">
      <img id="scanPreviewImage" alt="">
      <p id="scanPreviewInfo"></p>
    </div>

    <div id="scanPreviewActions">
      <button id="scanPreviewCloseBtn" type="button" autofocus>閉じる</button>
    </div>
  </dialog>

  <!-- js は読み込みのたびに別URLにして、ブラウザキャッシュを確実に迂回する（検証用） -->
  <script>
    (() => {
      const version = Date.now();
      // async = false で、記述した順（barcode.js → camera.js）に実行される
      for (const src of ['barcode.js', 'photo.js', 'camera.js']) {
        const script = document.createElement('script');
        script.src = `${src}?v=${version}`;
        script.async = false;
        document.body.appendChild(script);
      }
    })();
  </script>
</body>
</html>
