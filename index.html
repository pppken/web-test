<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- GitHub Pages は max-age=600 を付けて返すので、HTML は必ず再検証させる（更新が無ければ 304 で軽い） -->
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>カメラテスト</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      overscroll-behavior: none;
    }

    /* 画面全体をプレビュー領域にし、中央にカメラ映像を配置 */
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* 映像の描画サイズにぴったり追従する枠。UIはこの中に重ねる */
    #frame {
      position: relative;
      display: flex;
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
    }

    /* 停止中は映像が無いので、枠を画面いっぱいに広げてUIを配置する */
    #frame.idle {
      width: 100%;
      height: 100%;
    }

    /* 幅・高さを auto にすることで、画面に収まる最大サイズまで
       アスペクト比を維持したまま拡大される */
    #video {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      background: #000;
    }

    #video.mirrored {
      transform: scaleX(-1);
    }

    /* --- プレビューに重ねるUI --- */

    /* バーコードの検出領域。この枠の内側だけを切り出して解析する */
    #scanArea {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      /* 1D（横長）と 2D（正方形）のどちらも収まる比率にしている */
      width: 80%;
      max-width: 520px;
      height: 40%;
      min-height: 150px;
      max-height: 320px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      /* 枠の外側をまとめて暗くする */
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    /* 停止中はプレビューが無いので枠も隠す */
    #frame.idle #scanArea {
      display: none;
    }

    /* 読み取り結果のダイアログ */
    #result {
      width: 100%;
      max-width: min(420px, calc(100vw - 32px));
      margin: auto;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(28, 28, 30, 0.97);
      color: #fff;
    }

    #result::backdrop {
      background: rgba(0, 0, 0, 0.6);
    }

    #resultBody {
      padding: 22px 22px 0;
    }

    #resultTitle {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 600;
    }

    #result.error #resultTitle {
      color: #fca5a5;
    }

    #resultFormat {
      margin: 0 0 14px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.55);
    }

    #resultFormat:empty {
      display: none;
    }

    #resultValue {
      margin: 0;
      padding: 12px 14px;
      max-height: 40vh;
      overflow: auto;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 17px;
      line-height: 1.5;
      white-space: pre-line;
      word-break: break-all;
      user-select: text;
    }

    #resultActions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 18px 22px 22px;
    }

    #resultActions button {
      padding: 9px 18px;
      font-size: 14px;
    }

    #resultCloseBtn {
      background: rgba(45, 127, 249, 0.85);
      border-color: transparent;
    }

    #resultCloseBtn:hover:not(:disabled) {
      background: rgba(45, 127, 249, 1);
    }

    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      max-width: calc(100% - 24px);
      margin: 0;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      font-size: 13px;
      line-height: 1.4;
      transition: opacity 0.2s;
    }

    #status:empty {
      opacity: 0;
    }

    /* 使用中の検出エンジン。動いているかどうかの確認用 */
    #engine {
      position: absolute;
      top: 12px;
      right: 12px;
      margin: 0;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.75);
    }

    #engine:empty,
    #frame.idle #engine {
      display: none;
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px 12px;
      pointer-events: none;
    }

    #controls > button {
      pointer-events: auto;
    }

    button {
      padding: 11px 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: rgba(20, 20, 20, 0.55);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) {
      background: rgba(60, 60, 60, 0.7);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #startBtn {
      background: rgba(45, 127, 249, 0.85);
      border-color: transparent;
    }

    #startBtn:hover:not(:disabled) {
      background: rgba(45, 127, 249, 1);
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <video id="video" playsinline autoplay muted></video>

      <div id="scanArea" aria-hidden="true"></div>

      <p id="status"></p>
      <p id="engine"></p>

      <div id="controls">
        <button id="startBtn">カメラを起動</button>
        <button id="switchBtn" disabled>前後切替</button>
        <button id="stopBtn" disabled>停止</button>
      </div>
    </div>
  </div>

  <dialog id="result" aria-labelledby="resultTitle">
    <div id="resultBody">
      <h2 id="resultTitle">バーコードを検出しました</h2>
      <p id="resultFormat"></p>
      <p id="resultValue"></p>
    </div>

    <div id="resultActions">
      <button id="resultCopyBtn" type="button">コピー</button>
      <button id="resultCloseBtn" type="button" autofocus>閉じる</button>
    </div>
  </dialog>

  <!-- js は読み込みのたびに別URLにして、ブラウザキャッシュを確実に迂回する（検証用） -->
  <script>
    (() => {
      const version = Date.now();
      // async = false で、記述した順（barcode.js → camera.js）に実行される
      for (const src of ['barcode.js', 'camera.js']) {
        const script = document.createElement('script');
        script.src = `${src}?v=${version}`;
        script.async = false;
        document.body.appendChild(script);
      }
    })();
  </script>
</body>
</html>
