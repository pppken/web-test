<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>カメラテスト</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      overscroll-behavior: none;
    }

    /* 画面全体をプレビュー領域にし、中央にカメラ映像を配置 */
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* 映像の描画サイズにぴったり追従する枠。UIはこの中に重ねる */
    #frame {
      position: relative;
      display: flex;
      max-width: 100%;
      max-height: 100%;
    }

    /* 停止中は映像が無いので、枠を画面いっぱいに広げてUIを配置する */
    #frame.idle {
      width: 100%;
      height: 100%;
    }

    /* 幅・高さを auto にすることで、画面に収まる最大サイズまで
       アスペクト比を維持したまま拡大される */
    #video {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      background: #000;
    }

    #video.mirrored {
      transform: scaleX(-1);
    }

    /* --- プレビューに重ねるUI --- */
    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      max-width: calc(100% - 24px);
      margin: 0;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      font-size: 13px;
      line-height: 1.4;
      transition: opacity 0.2s;
    }

    #status:empty {
      opacity: 0;
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px 12px;
      pointer-events: none;
    }

    #controls > button {
      pointer-events: auto;
    }

    button {
      padding: 11px 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: rgba(20, 20, 20, 0.55);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) {
      background: rgba(60, 60, 60, 0.7);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #startBtn {
      background: rgba(45, 127, 249, 0.85);
      border-color: transparent;
    }

    #startBtn:hover:not(:disabled) {
      background: rgba(45, 127, 249, 1);
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <video id="video" playsinline autoplay muted></video>

      <p id="status"></p>

      <div id="controls">
        <button id="startBtn">カメラを起動</button>
        <button id="switchBtn" disabled>前後切替</button>
        <button id="stopBtn" disabled>停止</button>
      </div>
    </div>
  </div>

  <script src="camera.js"></script>
</body>
</html>
